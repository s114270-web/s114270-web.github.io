
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你是哪種狗 快速測出你的狗格</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="welcome-screen" class="screen active">
            <h1>
                <span>🐶 你是哪種狗 🦴</span>
                <div class="subtitle">快速測出你的狗格</div>
            </h1>
            <p>性格決定你的犬種！透過 15 個生活化問題，分析你的內在特質，看看你是哪種可愛狗狗。</p>
            <button id="start-button">立即開始測驗</button>
        </div>

        <div id="quiz-screen" class="screen">
            <h2 id="question-title">載入中...</h2>
            <div id="options-container" class="options"></div>
            <p class="question-count">進度：<span id="current-q">1</span> / 15</p>
        </div>

        <div id="result-screen" class="screen">
            <h2>你的狗格分析結果</h2>
            <div class="result-box">
                <h3 id="result-dog-name"></h3>
                <img id="result-dog-img" src="" alt="結果圖片">
                <p id="result-dog-desc"></p>
            </div>
            <button id="restart-result-button">再測一次</button>
        </div>
    </div>

    <button id="floating-restart" class="hidden">↩ 從頭開始</button>

    <script src="script.js"></script>
</body>
</html>
