<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你是什麼狗？期末問卷測驗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <div id="welcome-screen" class="screen active">
            <h1>🐶 你是什麼狗？人格特質測驗 🦴</h1>
            <p>這個期末作業將透過八個生活化問題，分析你的個性與習性，找出你最像的犬種！</p>
            <button id="start-button">開始測驗</button>
        </div>

        <div id="quiz-screen" class="screen">
            <h2 id="question-title"></h2>
            <div id="options-container" class="options">
                </div>
            <p class="question-count">問題 <span id="current-q">1</span> / 8</p>
        </div>

        <div id="result-screen" class="screen">
            <h2>你的結果是：</h2>
            <div class="result-box">
                <h3 id="result-dog-name"></h3>
                <img id="result-dog-img" src="" alt="測驗結果犬種圖片">
                <p id="result-dog-desc"></p>
            </div>
            <button id="restart-button">重新測驗</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
